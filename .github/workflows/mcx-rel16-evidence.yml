name: MCX Rel16 Evidence
on:
  push:
    branches: [mcx-standards-ingest-20261015]
    paths: ['.github/workflows/mcx-rel16-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve original official specification bytes
        run: |
          python - <<'PY'
          import io,json,zipfile,hashlib,pathlib,urllib.request
          url='https://www.3gpp.org/ftp/Specs/archive/23_series/23.280/23280-g70.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=90) as r: raw=r.read()
          if not zipfile.is_zipfile(io.BytesIO(raw)): raise RuntimeError('Official response is not ZIP')
          out=pathlib.Path('evidence'); out.mkdir()
          docs=[]
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in z.namelist():
                  if name.lower().endswith(('.doc','.docx')) and not name.startswith('__MACOSX/'):
                      data=z.read(name); target=out/pathlib.Path(name).name;target.write_bytes(data)
                      docs.append({'member':name,'filename':target.name,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          if not docs: raise RuntimeError('No actual specification file')
          (out/'provenance.json').write_text(json.dumps({'source':url,'package_sha256':hashlib.sha256(raw).hexdigest(),'files':docs},indent=2))
          print(json.dumps(docs))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mcx-23280-g70-original-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
