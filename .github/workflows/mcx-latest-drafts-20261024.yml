name: MCX priority latest-drafts probe 2026-10-24
on:
  push:
    branches: [mcx-release-rebuild-20261016]
    paths: ['.github/workflows/mcx-latest-drafts-20261024.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official latest-drafts priority directories
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,html.parser,json,pathlib,urllib.request,urllib.parse,re
          specs=["37.579-3","37.579-8","37.579-9","37.579-10","33.779","23.700-37","23.801-03","22.346"]
          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":self.links.extend(v for k,v in attrs if k=="href" and v)
          def test(spec):
              results=[]
              for base in ("https://www.3gpp.org/ftp","https://ftp.3gpp.org"):
                  for suffix in (f"/Specs/latest-drafts/{spec[:2]}_series/{spec}/",f"/Specs/latest-drafts/{spec[:2]}_series/"):
                      url=base+suffix
                      try:
                          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (3gpp official archive research)"})
                          with urllib.request.urlopen(req,timeout=30) as response: b=response.read(3000000);http=response.status
                          doc=Links();doc.feed(b.decode("utf-8","replace"))
                          links=[urllib.parse.unquote(urllib.parse.urlparse(urllib.parse.urljoin(url,u)).path.rsplit("/",1)[-1]) for u in doc.links]
                          matches=[f for f in links if f.lower().endswith(".zip") and f.startswith(spec.replace(".","")+"-")]
                          results.append({"url":url,"status":"listed","files":sorted(set(matches)),"total_links":len(links)})
                      except Exception as e:results.append({"url":url,"status":"failed","error":str(e)})
              return {"specification":spec,"attempts":results}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:rows=list(pool.map(test,specs))
          out=pathlib.Path("report");out.mkdir()
          (out/"latest_drafts_probe.json").write_text(json.dumps({"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"results":rows},indent=2),encoding="utf8")
          for r in rows:
              print(r["specification"],[(s["status"],s.get("files",[])[:8],s.get("error")) for s in r["attempts"]],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mcx-priority-latest-drafts-probe-20261024
          path: report/
          retention-days: 7
          if-no-files-found: error
