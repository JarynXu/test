            url: "https://www.3gpp.org/ftp/Specs/archive/29_series/29.500/29500-k00.zip"
            artifact_name: "mcx-29-500-v20-0-0-p0"
          - number: "29.522"
            version: "20.1.0"
            part: 0
            url: "https://www.3gpp.org/ftp/Specs/archive/29_series/29.522/29522-k10.zip"
            artifact_name: "mcx-29-522-v20-1-0-p0"
          - number: "29.522"
            version: "20.1.0"
            part: 1
            url: "https://www.3gpp.org/ftp/Specs/archive/29_series/29.522/29522-k10.zip"
            artifact_name: "mcx-29-522-v20-1-0-p1"
          - number: "29.522"
