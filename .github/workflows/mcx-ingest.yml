            artifact_name: "mcx-37-579-2-v18-1-0-p0"
          - number: "37.579-4"
            version: "18.1.0"
            part: 0
            url: "https://www.3gpp.org/ftp/Specs/archive/37_series/37.579-4/37579-4-i10.zip"
            artifact_name: "mcx-37-579-4-v18-1-0-p0"
          - number: "37.579-5"
            version: "19.1.0"
            part: 0
            url: "https://www.3gpp.org/ftp/Specs/archive/37_series/37.579-5/37579-5-j10.zip"
            artifact_name: "mcx-37-579-5-v19-1-0-p0"
          - number: "37.579-6"
            version: "18.0.0"
            part: 0
            url: "https://www.3gpp.org/ftp/Specs/archive/37_series/37.579-6/37579-6-i00.zip"
            artifact_name: "mcx-37-579-6-v18-0-0-p0"
          - number: "37.579-7"
            version: "17.7.0"
            part: 0
            url: "https://www.3gpp.org/ftp/Specs/archive/37_series/37.579-7/37579-7-h70.zip"
            artifact_name: "mcx-37-579-7-v17-7-0-p0"
    steps:
      - name: Fetch official 3GPP ZIP; select actual DOCX
        env:
          SPEC_URL: ${{ matrix.url }}
          PART: ${{ matrix.part }}
        shell: bash
        run: |
          python - <<'PY'
          import io, os, zipfile, pathlib, urllib.request, hashlib
          url=os.environ['SPEC_URL']; part=int(os.environ['PART'])
          urls=[url,url.replace('www.3gpp.org/ftp','ftp.3gpp.org/Specs').replace('/Specs/Specs/','/Specs/')]
          data=None
          for u in urls:
              try:
                  print('GET',u,flush=True)
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=65) as resp: data=resp.read()
                  if zipfile.is_zipfile(io.BytesIO(data)): break
              except Exception as e: print(type(e).__name__,str(e),flush=True)
          if not data or not zipfile.is_zipfile(io.BytesIO(data)): raise RuntimeError('3GPP official archive unavailable')
          with zipfile.ZipFile(io.BytesIO(data)) as arc:
              files=sorted(n for n in arc.namelist() if n.lower().endswith('.docx') and not any(t in n.lower() for t in ['redline','track-change']))
              print('DOCX_FILES',repr(files),flush=True)
              if part>=len(files): raise RuntimeError(f'File index {part} absent; count={len(files)}')
              raw=arc.read(files[part])
          if not zipfile.is_zipfile(io.BytesIO(raw)): raise RuntimeError('Not DOCX')
          out=pathlib.Path('docx_contents');out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as arc:
              names=arc.namelist()
              if '[Content_Types].xml' not in names or 'word/document.xml' not in names: raise RuntimeError('Invalid Office DOCX')
              arc.extractall(out)
          print('SOURCE_FILE',files[part],'SHA256',hashlib.sha256(raw).hexdigest(),'BYTES',len(raw),flush=True)
          PY
      - name: Publish DOCX-compatible artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: docx_contents/
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error